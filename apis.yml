aid: beaconcure
name: Beaconcure
description: 'Beaconcure is a clinical data technology company whose AI-enabled platform,
  Verify, automates the statistical analysis and reporting workflow for biometrics
  teams running clinical trials. Verify converts static Tables, Listings and Figures
  (TLFs) into machine-readable form and runs format, reference, within-table and cross-table
  validation checks, tracks quality-control progress in a shared review workspace,
  and captures every fix in an inspection-ready audit trail across its Essentials,
  Validate and Generate modules. Beaconcure also documents a customer-scoped Verify
  REST API that exposes near real-time QC data — deliverables, projects, protocols,
  users, files, suspected and verified outputs, and discrepancies — as JSON or CSV,
  though each customer receives a unique API version and endpoint behind an IP allowlist.
  Founded in Israel with US headquarters in Boston, the company works with top-10
  pharmaceutical companies and contract research organizations.'
