apis:
- name: Beaconcure Verify API
  description: 'A REST API over Verify''s near real-time quality-control data. Beaconcure
    documents it as resource-oriented, accepting form-encoded request bodies and returning
    JSON (or CSV on request) with standard HTTP status codes and verbs. It exposes
    counts and detail for deliverables, projects, protocols, users and files, plus
    QC analysis results such as suspected and verified files, tables and figures and
    the discrepancies found. Each customer organization receives its own API version
    and endpoint URL, issued by Beaconcure''s customer success team and restricted
    to an IP allowlist supplied during onboarding; the API reads from a partial clone
    of the customer''s data rather than the live Verify application.'
